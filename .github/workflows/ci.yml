name: CI

on:
  pull_request:
  push:
    branches: [main]

# Kein Default-Write-Token. Der Job liest nur Code - er braucht nichts sonst,
# und ein Token, das mehr darf als noetig, ist ein Angriffsziel.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  # Muss zum Service-Container unten passen. serverVersion verhindert, dass
  # Doctrine beim Start eine Extra-Abfrage fuer die Version schickt.
  DATABASE_URL: postgresql://app:app@127.0.0.1:5432/crm?serverVersion=17&charset=utf8

jobs:
  # Der Job-Name ist der Status-Check-Kontext, den das Ruleset auf main
  # verlangt. Wer ihn umbenennt, macht main unmergebar.
  ci:
    name: ci
    runs-on: ubuntu-latest
    timeout-minutes: 15

    services:
      db:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: crm
          POSTGRES_USER: app
          POSTGRES_PASSWORD: app
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U app -d crm"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@v4

      - name: PHP einrichten
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: pdo_pgsql, intl, zip, opcache
          coverage: none
          tools: composer:v2

      - name: Composer-Cache-Verzeichnis ermitteln
        id: composer-cache
        run: echo "dir=$(composer config cache-files-dir)" >> "$GITHUB_OUTPUT"

      - name: Composer-Cache
        uses: actions/cache@v4
        with:
          path: ${{ steps.composer-cache.outputs.dir }}
          key: composer-${{ runner.os }}-php8.4-${{ hashFiles('**/composer.lock') }}
          restore-keys: composer-${{ runner.os }}-php8.4-

      - name: AssetMapper-Vendor-Cache
        # importmap:install laedt Frontend-Pakete aus dem Netz nach. Ohne
        # Cache haengt jeder CI-Lauf an der Verfuegbarkeit eines CDN.
        uses: actions/cache@v4
        with:
          path: assets/vendor
          key: importmap-${{ hashFiles('importmap.php') }}
          restore-keys: importmap-

      # Laeuft vor dem Install: prueft nebenbei, ob composer.lock noch zur
      # composer.json passt.
      - name: composer validate
        run: composer validate --strict

      - name: composer install
        run: composer install --prefer-dist --no-progress --no-interaction

      - name: Container aufwaermen
        # PHPStan liest den kompilierten Container, um Service-Typen
        # aufzuloesen. Ohne diesen Schritt faellt Level 8 in sich zusammen.
        run: bin/console cache:warmup --env=dev

      - name: PHPStan
        run: vendor/bin/phpstan analyse --memory-limit=1G --no-progress

      - name: Deptrac
        # Das eigentliche Architektur-Gate. --fail-on-uncovered faengt auch
        # den Fall ab, dass ein neues Modul nicht in deptrac.yaml steht.
        run: vendor/bin/deptrac analyse --report-uncovered --fail-on-uncovered --no-progress

      - name: Testdatenbank vorbereiten
        run: |
          bin/console doctrine:database:create --if-not-exists --env=test
          bin/console doctrine:migrations:migrate -n --env=test

      - name: PHPUnit
        run: vendor/bin/phpunit
