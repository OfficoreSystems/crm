name: CI

on:
  pull_request:
  push:
    branches: [main]

# Kein Default-Write-Token. Der Job liest nur Code - er braucht nichts sonst,
# und ein Token, das mehr darf als noetig, ist ein Angriffsziel.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  # Muss zum Service-Container unten passen. serverVersion verhindert, dass
  # Doctrine beim Start eine Extra-Abfrage fuer die Version schickt.
  DATABASE_URL: postgresql://app:app@127.0.0.1:5432/crm?serverVersion=17&charset=utf8

  # Mindest-Zeilenabdeckung. Spiegelt COVERAGE_MIN im Makefile - wer den einen
  # Wert aendert, muss den anderen mitziehen.
  COVERAGE_MIN: "80"

jobs:
  # Der Job-Name ist der Status-Check-Kontext, den das Ruleset auf main
  # verlangt. Wer ihn umbenennt, macht main unmergebar.
  ci:
    name: ci
    runs-on: ubuntu-latest
    timeout-minutes: 15

    services:
      db:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: crm
          POSTGRES_USER: app
          POSTGRES_PASSWORD: app
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U app -d crm"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@v7

      - name: PHP einrichten
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: pdo_pgsql, intl, zip, opcache
          # pcov statt xdebug: gleiche Zeilenabdeckung, ein Bruchteil der
          # Laufzeit. Xdebug braucht der Job nicht, hier wird nicht debuggt.
          coverage: pcov
          # pcov instrumentiert nur unterhalb von pcov.directory, und
          # setup-php setzt das auf das erkannte Quellverzeichnis - hier also
          # src/. Die Module liegen darunter nicht und waeren komplett
          # ungemessen: der erste Lauf meldete 3.11 Prozent statt 98.76.
          # Deshalb explizit das Projektwurzelverzeichnis, ohne vendor/ und
          # var/, die sonst nur Zeit und Speicher kosten.
          ini-values: pcov.directory=., pcov.exclude="~(vendor|var)~"
          tools: composer:v2

      - name: Composer-Cache-Verzeichnis ermitteln
        id: composer-cache
        run: echo "dir=$(composer config cache-files-dir)" >> "$GITHUB_OUTPUT"

      - name: Composer-Cache
        uses: actions/cache@v6
        with:
          path: ${{ steps.composer-cache.outputs.dir }}
          key: composer-${{ runner.os }}-php8.4-${{ hashFiles('**/composer.lock') }}
          restore-keys: composer-${{ runner.os }}-php8.4-

      - name: AssetMapper-Vendor-Cache
        # importmap:install laedt Frontend-Pakete aus dem Netz nach. Ohne
        # Cache haengt jeder CI-Lauf an der Verfuegbarkeit eines CDN.
        uses: actions/cache@v6
        with:
          path: assets/vendor
          key: importmap-${{ hashFiles('importmap.php') }}
          restore-keys: importmap-

      # Laeuft vor dem Install: prueft nebenbei, ob composer.lock noch zur
      # composer.json passt.
      - name: composer validate
        run: composer validate --strict

      - name: composer install
        run: composer install --prefer-dist --no-progress --no-interaction

      - name: Container aufwaermen
        # PHPStan liest den kompilierten Container, um Service-Typen
        # aufzuloesen. Ohne diesen Schritt faellt Level 8 in sich zusammen.
        #
        # Explizit ueber `php`, nicht ueber den Shebang: das Executable-Bit
        # ist unter Windows leicht wieder verloren, und dann bricht der Job
        # mit exit 126 ab statt mit einer verstaendlichen Meldung.
        run: php bin/console cache:warmup --env=dev

      - name: PHPStan
        run: vendor/bin/phpstan analyse --memory-limit=1G --no-progress

      - name: Deptrac
        # Das eigentliche Architektur-Gate. --fail-on-uncovered faengt auch
        # den Fall ab, dass ein neues Modul nicht in deptrac.yaml steht.
        run: vendor/bin/deptrac analyse --report-uncovered --fail-on-uncovered --no-progress

      - name: Testdatenbank vorbereiten
        run: |
          php bin/console doctrine:database:create --if-not-exists --env=test
          php bin/console doctrine:migrations:migrate -n --env=test

      - name: PHPUnit mit Coverage
        run: vendor/bin/phpunit --coverage-clover=var/clover.xml

      - name: Coverage-Gate
        # Eigener Schritt, damit im roten Fall sofort sichtbar ist, ob Tests
        # fehlgeschlagen sind oder ob die Abdeckung zu niedrig war.
        run: php tools/coverage-gate.php var/clover.xml "${{ env.COVERAGE_MIN }}"
