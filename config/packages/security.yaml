# Absichtlich frei von Modulwissen.
#
# Hier steht nur, was ohne jedes Modul gilt: die Hasher-Vorgaben, der
# dev-Firewall und ein leerer Fallback-Provider. Welcher Provider tatsaechlich
# Benutzer laedt und wie die Anmeldung aussieht, prependet das user-Modul in
# UserModule::prependExtension().
#
# Der Fallback-Provider ist kein Schoenheitsfehler, sondern der Grund, warum
# die Anwendung ohne user-Modul startet: mit genau einem Provider waehlt
# Symfony ihn automatisch, und "main" braucht keinen benannten.
security:
    password_hashers:
        Symfony\Component\Security\Core\User\PasswordAuthenticatedUserInterface: 'auto'

    providers:
        # Feste Service-ID aus dem Shared Kernel. Der Vorgabewert dahinter
        # kennt niemanden; das user-Modul haengt dort seine Implementierung
        # ein. Deshalb steht hier kein Modulname.
        crm_users:
            id: crm.security.user_provider

    firewalls:
        dev:
            pattern: ^/(_profiler|_wdt|assets|build)/
            security: false
        main:
            lazy: true
            provider: crm_users

            # Literale Pfade statt Routennamen: die Routen bringt das
            # user-Modul mit. Ein Routenname hier wuerde den Container-Build
            # ohne dieses Modul scheitern lassen, ein Pfad laeuft dann
            # lediglich ins Leere.
            form_login:
                login_path: /login
                check_path: /login
                username_parameter: _username
                password_parameter: _password
                enable_csrf: true
                default_target_path: /
            logout:
                path: /logout
                target: /login

    # Nur die Grundregel: ohne Anmeldung geht nichts ausser der Anmeldung
    # selbst. Was ein angemeldeter Benutzer dann sehen darf, entscheidet der
    # Voter ueber die Rechtematrix - hier stehen bewusst keine Modulpfade,
    # sonst gaebe es zwei Orte, an denen Rechte definiert sind.
    access_control:
        - { path: ^/login$, roles: PUBLIC_ACCESS }

        # Der oeffentliche Bereich.
        #
        # Hier liegen Endpunkte, die von aussen aufgerufen werden und keine
        # Sitzung mitbringen koennen: ICS-Feeds fuer Outlook und Google,
        # Abmeldelinks in Newslettern, Webhooks fremder Dienste. Sie weisen
        # sich ueber ein Geheimnis in der URL aus - die Firewall kann ihnen
        # dabei nicht helfen.
        #
        # Der Praefix ist bewusst *generisch*: der Core weiss so nicht, welche
        # Module ihn benutzen. Er muesste es sonst wissen, denn
        # security.access_control laesst sich - wie security.firewalls - nicht
        # aus einem Modul heraus prependen ("cannot be overwritten").
        #
        # Wer hier etwas ablegt, uebernimmt die Pruefung selbst.
        - { path: ^/public/, roles: PUBLIC_ACCESS }

        - { path: ^/, roles: ROLE_USER }

when@test:
    security:
        password_hashers:
            # Hashing ist absichtlich teuer. In Tests waere das reine
            # Wartezeit, deshalb die niedrigsten zulaessigen Werte.
            Symfony\Component\Security\Core\User\PasswordAuthenticatedUserInterface:
                algorithm: auto
                cost: 4
                time_cost: 3
                memory_cost: 10
