services:
  php:
    build:
      context: .
      target: dev
    restart: unless-stopped
    ports:
      - "8080:80"
    environment:
      APP_ENV: dev
      APP_DEBUG: "1"
      # Zum Debuggen auf "debug" setzen und `make up` erneut ausfuehren.
      XDEBUG_MODE: ${XDEBUG_MODE:-off}
    volumes:
      - .:/app
      # Diese beiden liegen bewusst als benannte Volumes ueber dem Bind-Mount.
      # Ohne sie laeuft jeder Dateizugriff auf vendor/ (zehntausende Dateien)
      # ueber die Windows/macOS-Dateisystembruecke und ein Request dauert
      # Sekunden statt Millisekunden.
      - vendor:/app/vendor
      - var:/app/var
    depends_on:
      db:
        # Ohne diese Bedingung startet php schneller als Postgres und der
        # erste Request stirbt an "connection refused".
        condition: service_healthy
    extra_hosts:
      # Damit Xdebug den Host erreicht (Linux hat das nicht von selbst).
      - "host.docker.internal:host-gateway"

  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: crm
      POSTGRES_USER: app
      POSTGRES_PASSWORD: app
    ports:
      # Nur an Localhost gebunden - die Datenbank soll nicht im LAN haengen.
      - "127.0.0.1:5432:5432"
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U app -d crm"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  # Objektspeicher fuer Dokumente. S3-kompatibel, damit die Anwendung lokal
  # und in Produktion denselben Adapter benutzt - ein lokaler Dateipfad und
  # ein Bucket verhalten sich zu unterschiedlich, um erst spaet zu tauschen.
  storage:
    image: minio/minio:RELEASE.2025-04-22T22-12-26Z
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      # Local-Dev-Werte, wie bei Postgres. Produktion setzt echte
      # Umgebungsvariablen - siehe .env.
      MINIO_ROOT_USER: ${STORAGE_KEY:-officore}
      MINIO_ROOT_PASSWORD: ${STORAGE_SECRET:-officore-dev-passwort}
    ports:
      # Nur an Localhost: der Speicher soll nicht im LAN haengen.
      - "127.0.0.1:9000:9000"
      - "127.0.0.1:9001:9001"
    volumes:
      - storage_data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  # Legt den Bucket an und beendet sich. Ohne diesen Schritt scheitert der
  # erste Upload mit "NoSuchBucket" - und das sieht nach einem Fehler der
  # Anwendung aus, obwohl nur die Einrichtung fehlt.
  storage-init:
    image: minio/mc:RELEASE.2025-04-16T18-13-26Z
    depends_on:
      storage:
        condition: service_healthy
    environment:
      STORAGE_KEY: ${STORAGE_KEY:-officore}
      STORAGE_SECRET: ${STORAGE_SECRET:-officore-dev-passwort}
      STORAGE_BUCKET: ${STORAGE_BUCKET:-crm-documents}
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://storage:9000 $$STORAGE_KEY $$STORAGE_SECRET &&
      mc mb --ignore-existing local/$$STORAGE_BUCKET &&
      mc mb --ignore-existing local/$$STORAGE_BUCKET-test &&
      echo 'Buckets bereit.'
      "

  mailpit:
    image: axllent/mailpit:v1.30
    restart: unless-stopped
    ports:
      - "8025:8025"
      - "1025:1025"
    environment:
      MP_MAX_MESSAGES: "500"
      MP_SMTP_AUTH_ACCEPT_ANY: "1"
      MP_SMTP_AUTH_ALLOW_INSECURE: "1"

volumes:
  db_data:
  storage_data:
  vendor:
  var:
