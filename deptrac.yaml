## Architektur-Schranke.
##
## Zwei Regelebenen:
##   1. Modul-Isolation - ein Modul sieht nur den shared-kernel, nie ein
##      anderes Modul.
##   2. Schichtung innerhalb eines Moduls - Domain haengt an nichts,
##      Application an Domain, Infrastructure und UI an Domain+Application.
##
## Ausgeschlossen ist bewusst `config/`: DI-Wiring und die Bundle-Liste duerfen
## Schichten verbinden, das ist ihre Aufgabe. Der Code darf es nicht.
##
## Die Vendor-Layer unten sind kein Beiwerk: ohne sie meldet
## `--fail-on-uncovered` jeden Framework-Aufruf als ungedeckt. Sie sind eng
## geschnitten, damit "Domain haengt an nichts" nicht heimlich zu "Domain darf
## ganz Symfony" wird.

deptrac:
  paths:
    - ./src
    - ./modules

  # Die Zeichenklasse [\\/] ist Absicht: Deptrac matcht gegen den absoluten
  # Pfad, und der nutzt unter Windows Backslashes. Mit '.*/tests/.*' greift
  # der Ausschluss dort nicht und PHPUnit-Attribute schlagen als "uncovered"
  # auf.
  exclude_files:
    - '#.*[\\/]tests[\\/].*#'
    - '#.*[\\/]config[\\/].*#'

  # Die Layer werden ueber Namespaces geschnitten, nicht ueber Verzeichnisse.
  # Grund: der `directory`-Collector matcht gegen den *absoluten* Pfad. Ein
  # unverankertes `src/.*` sammelt damit auch modules/*/src/ ein, ein
  # verankertes `^src/.*` matcht dagegen nie. Der Namespace ist hier ohnehin
  # die Grenze, die wir meinen.
  layers:
    # ------------------------------------------------------------------ Core
    - name: Core
      collectors:
        - type: classNameRegex
          value: '#^App\\#'

    # --------------------------------------------------------- Vertragsschicht
    # Ohne Infrastructure und ohne die Bundle-Klasse: der Vertragsteil soll
    # frei von Persistenz bleiben und nichts verdrahten.
    - name: SharedKernel
      collectors:
        - type: bool
          must:
            - type: classNameRegex
              value: '#^Crm\\SharedKernel\\#'
          must_not:
            - type: classNameRegex
              value: '#^Crm\\SharedKernel\\Infrastructure\\#'
            - type: classNameRegex
              value: '#^Crm\\SharedKernel\\CrmSharedKernelBundle$#'

    # Der Teil des Shared Kernel, der Doctrine anfassen darf - derzeit nur der
    # Sichtbarkeitsfilter, der von SQLFilter erbt.
    #
    # Diese Trennung ist der Grund, warum "SharedKernel kennt nur Symfony"
    # weiter gilt. Ohne sie muesste die Vertragsschicht ganz Doctrine sehen,
    # nur weil eine einzige Klasse davon erbt.
    - name: SharedKernelInfrastructure
      collectors:
        - type: classNameRegex
          value: '#^Crm\\SharedKernel\\Infrastructure\\#'

    # Wie bei den Modulen: die Bundle-Klasse ist Verdrahtung und darf deshalb
    # Schichten verbinden - hier den Vertrag mit seiner eigenen Infrastruktur,
    # weil sie den Doctrine-Filter beim Framework anmeldet.
    - name: SharedKernelBundle
      collectors:
        - type: classNameRegex
          value: '#^Crm\\SharedKernel\\CrmSharedKernelBundle$#'

    # ------------------------------------------------------------ Modul: contact
    # Das Bundle selbst. Darf den shared-kernel und Symfony sehen, weil es sich
    # beim Framework anmeldet - aber nichts aus anderen Modulen.
    - name: ContactBundle
      collectors:
        - type: classNameRegex
          value: '#^Crm\\Contact\\ContactModule$#'

    - name: ContactDomain
      collectors:
        - type: classNameRegex
          value: '#^Crm\\Contact\\Domain\\#'

    - name: ContactApplication
      collectors:
        - type: classNameRegex
          value: '#^Crm\\Contact\\Application\\#'

    - name: ContactInfrastructure
      collectors:
        - type: classNameRegex
          value: '#^Crm\\Contact\\Infrastructure\\#'

    - name: ContactUI
      collectors:
        - type: classNameRegex
          value: '#^Crm\\Contact\\UI\\#'

    # --------------------------------------------------------------- Modul: user
    - name: UserBundle
      collectors:
        - type: classNameRegex
          value: '#^Crm\\User\\UserModule$#'

    - name: UserDomain
      collectors:
        - type: classNameRegex
          value: '#^Crm\\User\\Domain\\#'

    - name: UserApplication
      collectors:
        - type: classNameRegex
          value: '#^Crm\\User\\Application\\#'

    - name: UserInfrastructure
      collectors:
        - type: classNameRegex
          value: '#^Crm\\User\\Infrastructure\\#'

    - name: UserUI
      collectors:
        - type: classNameRegex
          value: '#^Crm\\User\\UI\\#'

    # ------------------------------------------------------------ Modul: company
    - name: CompanyBundle
      collectors:
        - type: classNameRegex
          value: '#^Crm\\Company\\CompanyModule$#'

    - name: CompanyDomain
      collectors:
        - type: classNameRegex
          value: '#^Crm\\Company\\Domain\\#'

    - name: CompanyApplication
      collectors:
        - type: classNameRegex
          value: '#^Crm\\Company\\Application\\#'

    - name: CompanyInfrastructure
      collectors:
        - type: classNameRegex
          value: '#^Crm\\Company\\Infrastructure\\#'

    - name: CompanyUI
      collectors:
        - type: classNameRegex
          value: '#^Crm\\Company\\UI\\#'

    # --------------------------------------------------------------- Modul: deal
    - name: DealBundle
      collectors:
        - type: classNameRegex
          value: '#^Crm\\Deal\\DealModule$#'

    - name: DealDomain
      collectors:
        - type: classNameRegex
          value: '#^Crm\\Deal\\Domain\\#'

    - name: DealApplication
      collectors:
        - type: classNameRegex
          value: '#^Crm\\Deal\\Application\\#'

    - name: DealInfrastructure
      collectors:
        - type: classNameRegex
          value: '#^Crm\\Deal\\Infrastructure\\#'

    - name: DealUI
      collectors:
        - type: classNameRegex
          value: '#^Crm\\Deal\\UI\\#'

    # ----------------------------------------------------------- Modul: activity
    - name: ActivityBundle
      collectors:
        - type: classNameRegex
          value: '#^Crm\\Activity\\ActivityModule$#'

    - name: ActivityDomain
      collectors:
        - type: classNameRegex
          value: '#^Crm\\Activity\\Domain\\#'

    - name: ActivityApplication
      collectors:
        - type: classNameRegex
          value: '#^Crm\\Activity\\Application\\#'

    - name: ActivityInfrastructure
      collectors:
        - type: classNameRegex
          value: '#^Crm\\Activity\\Infrastructure\\#'

    - name: ActivityUI
      collectors:
        - type: classNameRegex
          value: '#^Crm\\Activity\\UI\\#'

    # ----------------------------------------------------------- Modul: calendar
    - name: CalendarBundle
      collectors:
        - type: classNameRegex
          value: '#^Crm\\Calendar\\CalendarModule$#'

    - name: CalendarDomain
      collectors:
        - type: classNameRegex
          value: '#^Crm\\Calendar\\Domain\\#'

    - name: CalendarApplication
      collectors:
        - type: classNameRegex
          value: '#^Crm\\Calendar\\Application\\#'

    - name: CalendarInfrastructure
      collectors:
        - type: classNameRegex
          value: '#^Crm\\Calendar\\Infrastructure\\#'

    - name: CalendarUI
      collectors:
        - type: classNameRegex
          value: '#^Crm\\Calendar\\UI\\#'

    # ----------------------------------------------------------- Modul: document
    - name: DocumentBundle
      collectors:
        - type: classNameRegex
          value: '#^Crm\\Document\\DocumentModule$#'

    - name: DocumentDomain
      collectors:
        - type: classNameRegex
          value: '#^Crm\\Document\\Domain\\#'

    - name: DocumentApplication
      collectors:
        - type: classNameRegex
          value: '#^Crm\\Document\\Application\\#'

    - name: DocumentInfrastructure
      collectors:
        - type: classNameRegex
          value: '#^Crm\\Document\\Infrastructure\\#'

    - name: DocumentUI
      collectors:
        - type: classNameRegex
          value: '#^Crm\\Document\\UI\\#'

    # ------------------------------------------------------------- Modul: search
    - name: SearchBundle
      collectors:
        - type: classNameRegex
          value: '#^Crm\\Search\\SearchModule$#'

    - name: SearchDomain
      collectors:
        - type: classNameRegex
          value: '#^Crm\\Search\\Domain\\#'

    - name: SearchApplication
      collectors:
        - type: classNameRegex
          value: '#^Crm\\Search\\Application\\#'

    - name: SearchUI
      collectors:
        - type: classNameRegex
          value: '#^Crm\\Search\\UI\\#'

    # ---------------------------------------------------------- Modul: dashboard
    - name: DashboardBundle
      collectors:
        - type: classNameRegex
          value: '#^Crm\\Dashboard\\DashboardModule$#'

    - name: DashboardUI
      collectors:
        - type: classNameRegex
          value: '#^Crm\\Dashboard\\UI\\#'

    # ------------------------------------------------------------------ Fremdcode
    # Eng geschnitten und ueberschneidungsfrei: ein Token darf nur in genau
    # einem dieser Layer landen, sonst meldet Deptrac Verstoesse fuer den
    # jeweils breiteren Layer mit.
    - name: DoctrineMapping
      collectors:
        - type: classNameRegex
          value: '#^Doctrine\\ORM\\Mapping\\#'

    - name: Doctrine
      collectors:
        - type: bool
          must:
            - type: classNameRegex
              value: '#^Doctrine\\#'
          must_not:
            - type: classNameRegex
              value: '#^Doctrine\\ORM\\Mapping\\#'

    - name: SymfonyUid
      collectors:
        - type: classNameRegex
          value: '#^Symfony\\Component\\Uid\\#'

    - name: Symfony
      collectors:
        - type: bool
          must:
            - type: classNameRegex
              value: '#^Symfony\\#'
          must_not:
            - type: classNameRegex
              value: '#^Symfony\\Component\\Uid\\#'

    # Nur das document-Modul darf das sehen, und dort nur eine einzige Klasse.
    - name: Flysystem
      collectors:
        - type: classNameRegex
          value: '#^League\\Flysystem\\#'

    - name: Twig
      collectors:
        - type: classNameRegex
          value: '#^Twig\\#'

    - name: Psr
      collectors:
        - type: classNameRegex
          value: '#^Psr\\#'

  ruleset:
    # Der Core kennt die Vertragsschicht - und kein einziges Modul.
    Core:
      - SharedKernel
      - Symfony
      - Twig

    # Die Vertragsschicht kennt niemanden ausser dem Framework.
    SharedKernel:
      - Symfony

    # Darf zusaetzlich Doctrine sehen - und nur in diese Richtung: der Vertrag
    # kennt seine eigene Infrastruktur nicht.
    SharedKernelInfrastructure:
      - SharedKernel
      - Doctrine
      - DoctrineMapping
      - Symfony

    SharedKernelBundle:
      - SharedKernel
      - SharedKernelInfrastructure
      - Symfony

    ContactBundle:
      - SharedKernel
      - Symfony

    # Domain haengt an nichts Eigenem. Erlaubt sind nur Mapping-Attribute und
    # der Uuid-Wertetyp - beides Metadaten, keine Infrastruktur.
    ContactDomain:
      - DoctrineMapping
      - SymfonyUid
      # Contact haelt die Firma als skalare Uuid - keine Association, kein
      # Fremdschluessel, kein Wissen ueber das company-Modul.

    # SharedKernel, weil AssignContactToCompany ueber CompanyFinderInterface
    # prueft, ob es die Firma gibt. Ein Fremdschluessel kann das nicht - er
    # existiert ueber Modulgrenzen hinweg nicht.
    ContactApplication:
      - ContactDomain
      - SharedKernel
      - SymfonyUid

    # SharedKernel, weil hier DoctrineContactFinder liegt - die Umsetzung des
    # Extension-Points, ueber den andere Module Kontakte aufloesen.
    ContactInfrastructure:
      - ContactDomain
      - ContactApplication
      - SharedKernel
      - Doctrine
      - DoctrineMapping
      - SymfonyUid

    ContactUI:
      - ContactDomain
      - ContactApplication
      - SharedKernel
      - Symfony
      - SymfonyUid
      - Twig

    UserBundle:
      - SharedKernel
      - Symfony

    UserDomain:
      - DoctrineMapping
      - SymfonyUid

    UserApplication:
      - UserDomain
      - SymfonyUid

    # Darf zusaetzlich SharedKernel sehen: hier liegt die Implementierung von
    # UserFinderInterface, ueber die andere Module Benutzer nachschlagen.
    UserInfrastructure:
      - UserDomain
      - UserApplication
      - SharedKernel
      - Doctrine
      - DoctrineMapping
      - Symfony
      - SymfonyUid

    UserUI:
      - UserDomain
      - UserApplication
      - SharedKernel
      - Symfony
      - SymfonyUid
      - Twig

    CompanyBundle:
      - SharedKernel
      - Symfony

    CompanyDomain:
      - DoctrineMapping
      - SymfonyUid

    CompanyApplication:
      - CompanyDomain

    # SharedKernel, weil hier DoctrineCompanyFinder liegt - die Umsetzung des
    # Extension-Points, ueber den andere Module Firmen aufloesen.
    CompanyInfrastructure:
      - CompanyDomain
      - CompanyApplication
      - SharedKernel
      - Doctrine
      - DoctrineMapping
      - SymfonyUid

    CompanyUI:
      - CompanyDomain
      - CompanyApplication
      - SharedKernel
      - Symfony
      - SymfonyUid
      - Twig

    DealBundle:
      - SharedKernel
      - Symfony

    DealDomain:
      - DoctrineMapping
      - SymfonyUid

    DealApplication:
      - DealDomain
      - SymfonyUid

    # SharedKernel, weil hier der DealSubjectResolver liegt - ueber ihn
    # koennen Aktivitaeten und spaeter Dokumente an einer Verkaufschance
    # haengen, ohne dass jene dieses Modul kennen.
    DealInfrastructure:
      - DealDomain
      - DealApplication
      - SharedKernel
      - Doctrine
      - DoctrineMapping
      - SymfonyUid

    # SharedKernel: die Pipeline loest Firmen und Kontakte ueber die
    # Finder-Interfaces auf. DealDomain sieht sie nie - dort stehen nur
    # skalare UUIDs.
    DealUI:
      - DealDomain
      - DealApplication
      - SharedKernel
      - Symfony
      - SymfonyUid
      - Twig

    ActivityBundle:
      - SharedKernel
      - Symfony

    # Die einzige Domain, die den Shared Kernel sehen darf - und nur wegen
    # SubjectRef. Das ist ein reines Wertobjekt aus zwei Zeichenketten, kein
    # Dienst und keine Infrastruktur. Die Alternative waere ein zweites,
    # identisches SubjectRef im Modul plus Umwandlung an jeder Grenze; das
    # waere mehr Code fuer weniger Klarheit.
    ActivityDomain:
      - SharedKernel
      - DoctrineMapping
      - SymfonyUid

    ActivityApplication:
      - ActivityDomain
      - SharedKernel
      - SymfonyUid

    ActivityInfrastructure:
      - ActivityDomain
      - ActivityApplication
      - SharedKernel
      - Doctrine
      - DoctrineMapping
      - SymfonyUid

    ActivityUI:
      - ActivityDomain
      - ActivityApplication
      - SharedKernel
      - Symfony
      - SymfonyUid
      - Twig

    CalendarBundle:
      - SharedKernel
      - Symfony

    # SharedKernel wegen SubjectRef - ein Termin kann an einem Datensatz
    # haengen, muss aber nicht.
    CalendarDomain:
      - SharedKernel
      - DoctrineMapping
      - SymfonyUid

    CalendarApplication:
      - CalendarDomain
      - SharedKernel
      - SymfonyUid

    CalendarInfrastructure:
      - CalendarDomain
      - CalendarApplication
      - SharedKernel
      - Doctrine
      - DoctrineMapping
      - SymfonyUid

    # CalendarBundle: der Feed-Controller nimmt den Pfadpraefix aus der
    # Bundle-Klasse, damit Route und Firewall-Ausnahme nicht auseinanderlaufen.
    CalendarUI:
      - CalendarBundle
      - CalendarDomain
      - CalendarApplication
      - CalendarInfrastructure
      - SharedKernel
      - Symfony
      - SymfonyUid
      - Twig

    DocumentBundle:
      - SharedKernel
      - Symfony

    # SharedKernel wegen SubjectRef - dasselbe Wertobjekt wie bei Aktivitaeten.
    # Ein Dokument haengt an einem beliebigen Datensatz, und der Verweis ist
    # Typ plus ID, kein Fremdschluessel.
    DocumentDomain:
      - SharedKernel
      - DoctrineMapping
      - SymfonyUid

    DocumentApplication:
      - DocumentDomain
      - SharedKernel
      - SymfonyUid

    # Flysystem steht bewusst nur hier: FlysystemDocumentStorage ist die
    # einzige Klasse im Modul, die die Bibliothek kennt. Alles darueber
    # arbeitet gegen DocumentStorageInterface.
    DocumentInfrastructure:
      - DocumentDomain
      - DocumentApplication
      - SharedKernel
      - Doctrine
      - DoctrineMapping
      - Flysystem
      - SymfonyUid

    DocumentUI:
      - DocumentDomain
      - DocumentApplication
      - SharedKernel
      - Symfony
      - SymfonyUid
      - Twig

    # search hat keine Infrastructure-Schicht: das Modul besitzt keine Daten
    # und spricht mit keiner Datenbank. Es fragt nur die Registry.
    SearchBundle:
      - SharedKernel
      - Symfony

    # Wie ActivityDomain nur wegen eines Wertobjekts aus dem Shared Kernel -
    # hier ResolvedSubject, das bewertet wird.
    SearchDomain:
      - SharedKernel

    SearchApplication:
      - SearchDomain
      - SharedKernel

    SearchUI:
      - SearchDomain
      - SearchApplication
      - SharedKernel
      - Symfony
      - Twig

    # dashboard hat weder Domain noch Application noch Infrastructure: es gibt
    # nichts zu modellieren, nichts zu entscheiden und nichts zu speichern.
    # Die Module liefern fertige Kennzahlen, das Modul reicht sie durch.
    DashboardBundle:
      - SharedKernel
      - Symfony

    DashboardUI:
      - SharedKernel
      - Symfony
      - Twig
